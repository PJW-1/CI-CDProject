# 린터 설정 (Pillar 1: 가독성)
line-length = 110
target-version = "py310"

exclude = [
    ".git",
    "__pycache__",
    "logs",
    "certs",
    "models",
]

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes — 미사용 import/변수 탐지
    "I",    # isort — import 정렬
    "B",    # flake8-bugbear — 흔한 버그 패턴
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # 줄 길이는 formatter가 담당
    "B008",   # FastAPI 의 Depends() 기본값 패턴과 충돌
]

[lint.per-file-ignores]
"tests/*" = ["F401"]
