name: CI

# 청사진의 파이프라인:
#   Code Push → GitHub Actions → Pytest(4대 축 검증) → Build & Deploy
#
# 잡 분리 이유
#   lint / test-light : 수십 초 ~ 2분. 대부분의 변경은 여기서 걸린다.
#   test-vision       : MediaPipe 설치가 수백 MB라 무겁다. 별도 잡 + 캐시로 분리.
#   build             : 테스트 통과 후에만 이미지를 빌드하고 실제 기동까지 확인한다.

on:
  push:
    branches: ["main", "refining/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
        continue-on-error: true   # 포맷은 아직 강제하지 않는다. 경고로만 본다.

  test-light:
    name: Unit + Integration (A / C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r container_a_web/requirements.txt
          pip install -r container_c_gesture/requirements.txt

      - name: Run unit tests
        run: pytest tests/unit -v --cov=common --cov=container_c_gesture --cov-report=term-missing

      - name: Run integration tests
        run: pytest tests/integration -v

      - name: Verify 4 pillars are not regressed
        # 이 잡이 청사진의 핵심이다.
        # 하드코딩 IP/포트, 침묵 예외, print(), 전역 detector 공유가
        # 다시 들어오면 여기서 빌드가 깨진다.
        run: pytest -m pillars -v

  test-vision:
    name: Vision engine (MediaPipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"      # Container B와 동일한 버전
          cache: pip

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Cache MediaPipe model
        uses: actions/cache@v4
        with:
          path: container_b_vision/models
          key: hand-landmarker-${{ hashFiles('config/default.yaml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r container_b_vision/requirements.txt

      - name: Run vision tests
        run: pytest -m vision -v
        env:
          LOG_LEVEL: WARNING

  build:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, test-light]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for all containers to be healthy
        # healthcheck 가 있으므로 sleep 대신 실제 상태를 기다린다.
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep -v healthy | wc -l)
            if [ "$unhealthy" -eq 0 ]; then
              echo "모든 컨테이너 healthy"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "기동 실패:"
          docker compose ps
          docker compose logs --tail 100
          exit 1

      - name: Smoke test endpoints
        run: |
          set -e
          curl -sk --fail https://localhost:8443/health
          curl -sk --fail https://localhost:8443/api/info
          curl -sk --fail https://localhost:8443/api/config
          curl -sk --fail -o /dev/null https://localhost:8443/api/qr/ci-smoke
          echo "스모크 테스트 통과"

      - name: Verify structured logging is emitted
        # 로그가 유효한 JSON 이고 표준 필드를 갖는지 실제 컨테이너에서 확인한다.
        run: |
          docker compose logs --no-color container_c \
            | grep -o '{.*}' | head -1 \
            | python -c "import json,sys; r=json.load(sys.stdin); [r[k] for k in ('ts','container','level','event')]; print('로그 스키마 OK')"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
