[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: 외부 의존성 없는 순수 로직 테스트
    integration: FastAPI 앱을 띄우는 통합 테스트
    vision: MediaPipe가 필요한 무거운 테스트 (CI에서 별도 잡으로 분리)
    pillars: 4대 축이 되돌아가지 않는지 강제하는 회귀 테스트
filterwarnings =
    ignore::DeprecationWarning
